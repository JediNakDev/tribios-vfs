name: Pull request checks

# The full tier ladder: tier 0 unit, tier 1 invariant, tier 2 design.
#
# Linux runs it strictly against a real mount. macOS runs the same ladder
# without the strict flag, for the reason spelled out on that job.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-mounted-tests-on-linux:
    name: Strict mounted tests on Linux
    runs-on: ubuntu-latest

    # GitHub-hosted ubuntu runners expose /dev/fuse and libfuse 2.x is an
    # ordinary package, so every mounted-path test really mounts here.
    # TRIBIOS_REQUIRE_MOUNT=1 turns any skip into a failure.
    env:
      TRIBIOS_REQUIRE_MOUNT: '1'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build and FUSE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            sqlite3 \
            libsqlite3-dev \
            libfuse-dev \
            fuse \
            g++-13

      - name: Configure the build
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: ninja -C build

      # A build without a FUSE backend would make every mounted test skip, and
      # TRIBIOS_REQUIRE_MOUNT would then fail them one by one. Fail here instead,
      # with a clear reason.
      - name: Verify a FUSE backend was found
        run: |
          test -e /dev/fuse
          grep -q TRIBIOS_HAVE_FUSE build/compile_commands.json

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure --no-tests=error

      - name: Run invariant tests
        run: ctest --test-dir build -L invariant --parallel 4 --output-on-failure --no-tests=error

      - name: Run design tests
        run: ctest --test-dir build -L design --output-on-failure --no-tests=error

  build-and-unmounted-tests-on-macos:
    name: Build and unmounted tests on macOS
    runs-on: macos-latest

    # This job deliberately does NOT set TRIBIOS_REQUIRE_MOUNT.
    #
    # The FUSE adapter speaks the FUSE 2.x API, which on macOS means macFUSE.
    # The macFUSE kernel extension has to be approved by hand in System
    # Settings, Privacy & Security, followed by a reboot, and on Apple Silicon
    # it also needs Reduced Security with user management of kernel extensions
    # enabled from Recovery. None of that is possible on a GitHub-hosted macOS
    # runner, so a mounted run cannot happen here and demanding one would only
    # produce a permanently red job.
    #
    # What this job does buy: macOS compile breakage and the non-mounted engine
    # paths (the `tribios fs` seam the FUSE callbacks call) are still caught.
    # The mounted macOS measurements that decide issue #1 come from the
    # self-hosted runner in benchmark.yml, per docs/prototype/experiment.md.
    # Linux numbers are never substituted for macOS ones.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake ninja sqlite pkg-config llvm

      # C++23 std::expected needs Xcode 16 or newer; Homebrew LLVM is the
      # compiler docs/prototype/README.md names, so it is pinned rather than
      # trusting whichever Xcode the runner image ships.
      - name: Configure the build
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          PKG_CONFIG_PATH="$(brew --prefix sqlite)/lib/pkgconfig"
          export PKG_CONFIG_PATH
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/c++"

      - name: Build
        run: ninja -C build

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure --no-tests=error

      - name: Run invariant tests
        run: ctest --test-dir build -L invariant --parallel 4 --output-on-failure --no-tests=error

      - name: Run design tests
        run: ctest --test-dir build -L design --output-on-failure --no-tests=error
