name: Pull request checks

# The full tier ladder: tier 0 unit, tier 1 invariant, tier 2 design.
#
# Both platforms run it strictly against a real mount, across the Linux
# filesystems each Linux backend claims.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-mounted-tests-on-linux:
    name: Strict mounted tests on Linux (${{ matrix.arch }}, ${{ matrix.backing }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        backing: [ext4, xfs, btrfs]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - backing: ext4
            expected_backend: overlayfs
          - backing: xfs
            expected_backend: overlayfs
          - backing: btrfs
            expected_backend: btrfs-snapshot

    # A GitHub-hosted Ubuntu runner can install the Workspace storage service
    # and mount OverlayFS in the host mount namespace, so every mounted-path
    # test really mounts here.
    # TRIBIOS_REQUIRE_MOUNT=1 turns any skip into a failure.
    env:
      TRIBIOS_REQUIRE_MOUNT: '1'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            sqlite3 \
            libsqlite3-dev \
            e2fsprogs \
            xfsprogs \
            btrfs-progs \
            g++-13

      - name: Create the ${{ matrix.backing }} backing filesystem
        run: |
          truncate -s 4G "$RUNNER_TEMP/tribios-backing.img"
          case "${{ matrix.backing }}" in
            ext4) sudo mkfs.ext4 -F "$RUNNER_TEMP/tribios-backing.img" ;;
            xfs) sudo mkfs.xfs -f "$RUNNER_TEMP/tribios-backing.img" ;;
            btrfs) sudo mkfs.btrfs -f "$RUNNER_TEMP/tribios-backing.img" ;;
          esac
          sudo mkdir /mnt/tribios-backing
          sudo mount -o loop "$RUNNER_TEMP/tribios-backing.img" /mnt/tribios-backing
          sudo chown "$USER" /mnt/tribios-backing
          echo "TMPDIR=/mnt/tribios-backing" >> "$GITHUB_ENV"

      - name: Configure the build
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: ninja -C build

      # Linux mounts a Workspace through an installed system service, which is
      # what `tribios install-privileges` enables on a user's machine.
      # cmake --install runs as root, so the manifest it leaves in the build
      # tree is handed back: the packaging design tests stage their own install.
      - name: Install the Workspace storage service
        run: |
          sudo cmake --install build --prefix /usr/local
          sudo chown "$USER" build/install_manifest.txt
          sudo systemctl daemon-reload
          sudo systemctl enable --now tribios-storage.service

      # Without a usable backend every mounted test would skip, and
      # TRIBIOS_REQUIRE_MOUNT would then fail them one by one. Fail here
      # instead, with a clear reason, and name the backend the matrix expects so
      # a silent fallback to the other one is a failure too.
      - name: Verify the expected Workspace storage backend is available
        run: |
          test "$(findmnt -no FSTYPE "$TMPDIR")" = "${{ matrix.backing }}"
          systemctl is-active tribios-storage.service
          probe="$(mktemp -d)"
          git init -q "$probe"
          git -C "$probe" -c user.email=ci@example.com -c user.name=CI \
            commit -q --allow-empty -m probe
          build/tribios configure "$probe" > "$probe.configure.out"
          cat "$probe.configure.out"
          grep -qx "storage backend: ${{ matrix.expected_backend }}" "$probe.configure.out"
          rm -rf "$probe" "$probe.configure.out"

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure --no-tests=error

      - name: Run invariant tests
        run: ctest --test-dir build -L invariant --parallel 4 --output-on-failure --no-tests=error

      - name: Run design tests
        run: ctest --test-dir build -L design --output-on-failure --no-tests=error

  strict-mounted-tests-on-macos:
    name: Strict mounted tests on macOS
    runs-on: macos-latest

    # The APFS adapter attaches sparse images with hdiutil, which is part of
    # macOS and needs no kernel extension, no reboot and no Reduced Security.
    # A hosted runner can therefore mount for real, which the macFUSE prototype
    # could never do here, so this job is strict like the Linux one.
    #
    # The macOS measurements that decide issue #1 still come from the
    # self-hosted runner in benchmark.yml, per docs/prototype/experiment.md.
    # Linux numbers are never substituted for macOS ones.
    env:
      TRIBIOS_REQUIRE_MOUNT: '1'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake ninja sqlite pkg-config llvm

      # C++23 std::expected needs Xcode 16 or newer; Homebrew LLVM is the
      # compiler docs/prototype/README.md names, so it is pinned rather than
      # trusting whichever Xcode the runner image ships.
      - name: Configure the build
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          PKG_CONFIG_PATH="$(brew --prefix sqlite)/lib/pkgconfig"
          export PKG_CONFIG_PATH
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/c++"

      - name: Build
        run: ninja -C build

      # Without a usable backend every mounted test would skip, and
      # TRIBIOS_REQUIRE_MOUNT would then fail them one by one. Fail here
      # instead, with a clear reason.
      - name: Verify the APFS Workspace storage backend is available
        run: |
          probe="$(mktemp -d)/project"
          mkdir -p "$probe"
          git init -q "$probe"
          git -C "$probe" -c user.email=ci@example.com -c user.name=CI \
            commit -q --allow-empty -m probe
          build/tribios configure "$probe" > "$probe.configure.out"
          cat "$probe.configure.out"
          grep -qx "storage backend: apfs-shadow" "$probe.configure.out"
          rm -rf "$probe" "$probe.configure.out"

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure --no-tests=error

      - name: Run invariant tests
        run: ctest --test-dir build -L invariant --parallel 4 --output-on-failure --no-tests=error

      - name: Run design tests
        run: ctest --test-dir build -L design --output-on-failure --no-tests=error
