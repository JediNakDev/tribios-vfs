name: Release

# Publishes the immutable source archive every downstream packaging recipe
# consumes: the Homebrew formula, the PKGBUILD, the Debian source package and
# the Copr spec all fetch this archive and verify it against the checksum file
# published beside it. docs/release-and-install-contract.md records the contract.
#
# The archive is produced with `git archive` from the tag, so it is a pure
# function of the tagged tree and is reproducible by anyone with the tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-archive:
    name: Publish the release archive and checksums
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Check the tag against the project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^project(tribios_vfs VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match CMakeLists.txt version $project_version" >&2
            exit 1
          fi

      - name: Build the archive and record its checksum
        run: |
          name="tribios-vfs-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="tribios-vfs-${GITHUB_REF_NAME#v}"
          # A tag that moves re-runs this job, and the release already exists by
          # then. Re-uploading keeps the published archive a function of the
          # tagged tree instead of leaving a stale one behind.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "$name.tar.gz" "$name.tar.gz.sha256"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease \
              "$name.tar.gz" "$name.tar.gz.sha256"
          fi

  update-homebrew-tap:
    name: Point the Homebrew tap at the new release
    needs: publish-archive
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Load the tap deploy key
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set, so the tap cannot be updated." >&2
            echo "Add a write-enabled deploy key for JediNakDev/homebrew-tap as that" >&2
            echo "secret. packaging/homebrew/README.md explains it." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # The secret is stored with its trailing newline stripped, and ssh
          # rejects a private key whose final line is unterminated.
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          ssh-keyscan github.com > ~/.ssh/known_hosts 2>/dev/null

      - name: Pin the formula to the published archive
        run: packaging/homebrew/update-formula.sh "${GITHUB_REF_NAME#v}"

      - name: Push the formula to the tap
        env:
          # IdentitiesOnly stops ssh offering any other key the runner happens
          # to have, which would authenticate as the wrong principal.
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/tap_deploy_key -o IdentitiesOnly=yes"
        run: |
          git clone git@github.com:JediNakDev/homebrew-tap.git tap
          # The tap repository is generated wholesale from packaging/homebrew/tap,
          # README and CI included, so the tap is never edited by hand. The
          # trailing /. copies the dotfiles a glob would miss.
          cp -R packaging/homebrew/tap/. tap/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the tap is already up to date"
            exit 0
          fi
          git commit -m "tribios-vfs ${GITHUB_REF_NAME}"
          # HEAD:main rather than a bare push, so this works on a tap repository
          # that was created empty and has no upstream branch yet.
          git push origin HEAD:main

  update-aur-package:
    name: Point the AUR package at the new release
    needs: publish-archive
    runs-on: ubuntu-latest
    # makepkg generates .SRCINFO and refuses to run outside Arch, so the whole
    # job runs in an Arch container rather than shipping a hand-kept .SRCINFO.
    container: archlinux:base-devel

    steps:
      - name: Install the tools the container does not ship
        run: pacman -Syu --noconfirm git openssh curl

      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Check that the AUR key exists
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not set, so the AUR package cannot be updated." >&2
            echo "Add the private half of the SSH key registered on the AUR account" >&2
            echo "as a repository secret. packaging/aur/README.md explains it." >&2
            exit 1
          fi

      - name: Pin the recipe to the published archive
        # makepkg refuses to run as root, and the checkout is owned by root, so
        # the recipe is regenerated as an unprivileged user.
        run: |
          useradd --create-home --shell /bin/bash aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /home/aur/
          chown -R aur /home/aur
          su aur -c "$PWD/packaging/aur/update-recipe.sh '${GITHUB_REF_NAME#v}' /home/aur"

      - name: Push the recipe to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 /home/aur/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/aur/.ssh/id_ed25519
          chmod 600 /home/aur/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org > /home/aur/.ssh/known_hosts
          chown -R aur /home/aur/.ssh
          su aur -c '
            set -e
            cd /home/aur
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git clone ssh://aur@aur.archlinux.org/tribios-vfs.git aur
            cp PKGBUILD .SRCINFO aur/
            cd aur
            git add -A
            if git diff --cached --quiet; then
              echo "the AUR package is already up to date"
              exit 0
            fi
            git commit -m "tribios-vfs '"${GITHUB_REF_NAME}"'"
            # HEAD:master rather than a bare push, because the first release
            # pushes into a package repository the AUR creates empty, which has
            # no upstream branch to push to. The AUR's branch is master.
            git push origin HEAD:master
          '
