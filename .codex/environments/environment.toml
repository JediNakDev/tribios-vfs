# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "tribios-vfs"

[setup]
script = '''
echo "Tribios VFS supports macOS and Linux only." >&2
exit 1'''

[setup.darwin]
script = '''
set -euo pipefail

brew install cmake ninja sqlite pkg-config
export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

if ! pkg-config --exists fuse && ! pkg-config --exists osxfuse; then
  echo "macFUSE must be installed, approved in System Settings, and active before setup." >&2
  exit 1
fi

if ! printf '#include <expected>\nint main() { std::expected<int, int> value(1); return *value; }\n' \
    | c++ -std=c++23 -x c++ -fsyntax-only - >/dev/null 2>&1; then
  brew install llvm
  export CC="$(brew --prefix llvm)/bin/clang"
  export CXX="$(brew --prefix llvm)/bin/clang++"
fi

cmake -S . -B build -G Ninja
cmake --build build --parallel'''

[setup.linux]
script = '''
set -euo pipefail

if command -v apt-get >/dev/null 2>&1; then
  sudo apt-get update
  sudo apt-get install -y --no-install-recommends \
    build-essential \
    cmake \
    ninja-build \
    pkg-config \
    libsqlite3-dev \
    libfuse-dev \
    git \
    python3
elif command -v dnf >/dev/null 2>&1; then
  sudo dnf install -y \
    gcc-c++ \
    cmake \
    ninja-build \
    pkgconf-pkg-config \
    sqlite-devel \
    fuse-devel \
    git \
    python3
elif command -v pacman >/dev/null 2>&1; then
  sudo pacman -S --needed --noconfirm \
    base-devel \
    cmake \
    ninja \
    pkgconf \
    sqlite \
    fuse2 \
    git \
    python
else
  echo "Unsupported Linux package manager. Install a C++23 compiler, CMake, Ninja, pkg-config, SQLite, and FUSE 2 development files." >&2
  exit 1
fi

if ! printf '#include <expected>\nint main() { std::expected<int, int> value(1); return *value; }\n' \
    | c++ -std=c++23 -x c++ -fsyntax-only - >/dev/null 2>&1; then
  echo "The installed C++ compiler does not provide C++23 std::expected." >&2
  exit 1
fi

cmake -S . -B build -G Ninja
cmake --build build --parallel'''

[setup.win32]
script = '''
Write-Error "Tribios VFS currently does not support native Windows. Configure Codex to use WSL 2 and use the Linux environment scripts."
exit 1'''

[cleanup]
script = '''
set -u

if [ -d .tribios ] && [ -x build/tribios ] \
    && build/tribios --project "$PWD" daemon status >/dev/null 2>&1; then
  build/tribios --project "$PWD" workspace wait-reclaim
  build/tribios --project "$PWD" daemon stop
fi

cmake -E remove_directory build'''

[cleanup.darwin]
script = '''
set -u

if [ -d .tribios ] && [ -x build/tribios ] \
    && build/tribios --project "$PWD" daemon status >/dev/null 2>&1; then
  build/tribios --project "$PWD" workspace wait-reclaim
  build/tribios --project "$PWD" daemon stop
fi

cmake -E remove_directory build'''

[cleanup.linux]
script = '''
set -u

if [ -d .tribios ] && [ -x build/tribios ] \
    && build/tribios --project "$PWD" daemon status >/dev/null 2>&1; then
  build/tribios --project "$PWD" workspace wait-reclaim
  build/tribios --project "$PWD" daemon stop
fi

cmake -E remove_directory build'''

[cleanup.win32]
script = '''
$ErrorActionPreference = "Stop"

if (Test-Path "build") {
    Remove-Item -Recurse -Force "build"
}'''

[[actions]]
name = "Test (macOS)"
icon = "tool"
command = '''
set -euo pipefail

export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

if ! printf '#include <expected>\nint main() { std::expected<int, int> value(1); return *value; }\n' \
    | c++ -std=c++23 -x c++ -fsyntax-only - >/dev/null 2>&1; then
  export CC="$(brew --prefix llvm)/bin/clang"
  export CXX="$(brew --prefix llvm)/bin/clang++"
fi

cmake -S . -B build -G Ninja
cmake --build build --parallel
